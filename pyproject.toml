[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily-digest"
version = "1.0.0"
description = "AI 技术日报精选工具 - 自动采集 RSS，AI 评分生成日报"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "WorkBuddy User", email = "your-email@example.com"}
]
maintainers = [
    {name = "huangds", email = "your-email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["rss", "ai", "digest", "news", "tech", "newsletter", "workbuddy", "skill"]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
ai-digest-fetch = "scripts.rss_fetch:main"
ai-digest = "scripts.rss_digest:main"

[project.urls]
Homepage = "https://github.com/huangds/ai-daily-digest"
Repository = "https://github.com/huangds/ai-daily-digest"
Bug Tracker = "https://github.com/huangds/ai-daily-digest/issues"
Documentation = "https://github.com/huangds/ai-daily-digest#readme"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["rss_fetch", "rss_digest"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
addopts = "-v --tb=short"
