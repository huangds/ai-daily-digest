---
name: 功能请求 (Feature Request)
description: 提议一个新的功能或改进
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请填写以下信息，帮助我们理解你的需求。💡

  - type: textarea
    id: feature-description
    attributes:
      label: 💡 功能描述
      description: 清晰、详细地描述你希望添加的功能
      placeholder: "例如：希望添加按关键词过滤文章的功能，只保留包含特定关键词的文章"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 🎯 使用场景
      description: 为什么需要这个功能？在什么场景下会用到？
      placeholder: "例如：每天生成的日报包含太多不相关的文章，我希望能过滤掉特定主题"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 🔧 建议的实现方案
      description: 如果你有具体的实现思路，请一并提供（可选）
      placeholder: "例如：在 rss_fetch.py 中添加 --keyword 参数，支持多个关键词，逻辑为 OR"

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 替代方案
      description: 有没有其他可行的替代方案？
      placeholder: "例如：可以在生成日报后，手动编辑 Markdown 文件删除不相关的文章"

  - type: textarea
    id: additional
    attributes:
      label: 📎 其他信息
      description: 任何其他有助于理解这个功能的信息
      placeholder: "例如：参考了其他类似工具的实现方式"

  - type: checkboxes
    id: terms
    attributes:
      label: ✅ 确认
      options:
        - label: 我已搜索现有的 Issue 和 Feature Request，确认这个功能没有被提议过
          required: true
        - label: 我已阅读并遵守 [行为准则](https://github.com/huangds/ai-daily-digest/blob/main/CODE_OF_CONDUCT.md)
          required: true
